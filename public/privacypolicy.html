<h1>근육지도 · 건강 데이터 사용 안내</h1>
<p>이 앱은 헬스 커넥트에서 <b>걸음 수, 활동 칼로리, 운동 기록, 체중</b>을 읽기만 합니다.</p>
<ul><li>읽은 값은 이 폰 안에서 오늘 활동과 운동별 칼로리를 보여주는 데만 씁니다.</li>
<li>건강 데이터를 외부 서버로 보내지 않고, 헬스 커넥트에 쓰지도 않습니다.</li>
<li>권한은 헬스 커넥트 설정에서 언제든 끌 수 있습니다.</li></ul></body></html>
