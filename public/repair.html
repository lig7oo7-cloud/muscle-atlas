<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>근육지도 앱 복구</title>
<style>
body{margin:0;background:#f5f5f0;color:#192827;font:17px/1.55 system-ui,sans-serif}
main{max-width:34rem;margin:10vh auto;padding:0 1.25rem}
h1{font-size:1.65rem}button,a{background:#ff7351;color:#192827;border:0;border-radius:.6rem;padding:.65rem .9rem;font:inherit;font-weight:700;text-decoration:none;display:inline-block}button:disabled{opacity:.55}
[hidden]{display:none}
</style>
</head>
<body>
<main>
<h1>근육지도 앱 복구</h1>
<p>저장된 운동 기록은 그대로 두고 앱 실행 파일만 갱신합니다.</p>
<p id="status" role="status">최신 실행 파일을 확인하고 있어요.</p>
<button id="retry" type="button" hidden>다시 시도</button>
<a id="open" href="/" hidden>근육지도 열기</a>
</main>
<script>
const statusText=document.getElementById('status');
const retry=document.getElementById('retry');
const openApp=document.getElementById('open');
function activated(worker){
  if(worker.state==='activated')return Promise.resolve();
  return new Promise((resolve,reject)=>{
    const check=()=>{
      if(worker.state==='activated'){clearTimeout(timer);resolve()}
      if(worker.state==='redundant'){clearTimeout(timer);reject(new Error('Update failed'))}
    };
    const timer=setTimeout(()=>reject(new Error('Update timed out')),20000);
    worker.addEventListener('statechange',check);
    check();
  });
}
async function repair(){
  retry.hidden=true;
  openApp.hidden=true;
  statusText.textContent='최신 실행 파일을 확인하고 있어요.';
  try{
    const registration=await navigator.serviceWorker.register('/sw.js',{scope:'/',updateViaCache:'none'});
    await registration.update();
    const worker=registration.installing||registration.waiting||registration.active;
    if(!worker)throw new Error('Update unavailable');
    await activated(worker);
    statusText.textContent='복구가 끝났어요. 아래 버튼으로 앱을 열거나 홈 화면 아이콘에서 다시 실행하세요.';
    openApp.hidden=false;
  }catch{
    statusText.textContent='복구를 완료하지 못했어요. 인터넷 연결을 확인하고 다시 시도하세요.';
    retry.hidden=false;
  }
}
retry.addEventListener('click',repair);
repair();
</script>
</body>
</html>
