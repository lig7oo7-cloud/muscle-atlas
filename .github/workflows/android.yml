name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install & build web app
        run: |
          npm ci
          npm run build

      - name: Create Android project
        run: |
          npm install --no-save @capacitor/assets@3
          npx cap add android
          # 헬스 커넥트는 Android 8.0(API 26) 이상 필요
          sed -i 's/minSdkVersion = 24/minSdkVersion = 26/' android/variables.gradle
          mkdir -p assets
          cp public/icon512.png assets/icon.png
          npx capacitor-assets generate --android --iconBackgroundColor '#192827' --splashBackgroundColor '#f5f4ef' || echo "icon generation skipped"
          # 빌드할 때마다 버전 번호를 올려서 덮어쓰기 설치가 되게 함
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle
          npx cap sync android

      - name: Build APK
        working-directory: android
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          chmod +x gradlew
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > $RUNNER_TEMP/app.jks
            ./gradlew assembleRelease \
              -Pandroid.injected.signing.store.file=$RUNNER_TEMP/app.jks \
              -Pandroid.injected.signing.store.password=muscleatlas \
              -Pandroid.injected.signing.key.alias=muscleatlas \
              -Pandroid.injected.signing.key.password=muscleatlas
            cp app/build/outputs/apk/release/app-release.apk $GITHUB_WORKSPACE/muscle-atlas.apk
          else
            echo "::warning::KEYSTORE_BASE64 secret이 없어 임시 디버그 서명으로 빌드합니다 (다음 업데이트 시 덮어쓰기 설치가 안 될 수 있음)"
            ./gradlew assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk $GITHUB_WORKSPACE/muscle-atlas.apk
          fi

      - name: Publish to "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest muscle-atlas.apk \
            --title "근육지도 APK (빌드 ${{ github.run_number }})" \
            --notes "폰에서 muscle-atlas.apk 를 눌러 내려받아 설치하세요."
